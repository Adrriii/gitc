[package]
name = "gitc"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A fast, minimal git client: commit graph, branching, rebase and conflict resolution in a single native binary."
repository = "https://github.com/Adrriii/gitc"
authors = ["Adrien Boitelle"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wayland", "x11", "accesskit", "clipboard", "links", "persistence"] }
egui_extras = { version = "0.37", features = ["syntect", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
notify = "8.2"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusty-leveldb = "4.0.2"
egui-winit = { version = "0.37", default-features = false, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
