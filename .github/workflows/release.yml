# Builds gitc for Windows and Linux and attaches the binaries to a release.
#
# The binaries ARE the installer: running one installs gitc and starts it, so a
# release needs no packaging step and no extra artefacts.
#
# Triggered by pushing a tag, or by hand from the Actions tab (which builds
# without publishing, so the toolchain can be checked without cutting a
# release).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gitc.exe
            built: dist/gitc.exe
          - os: ubuntu-latest
            artifact: gitc
            built: dist/gitc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # scriptc needs Node 24 or newer; it is the interpreter the build runs
      # under, so this is the whole Node requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Windows needs zig: scriptc's runtime assumes mingw's CRT and a stock
      # clang targets MSVC's. Linux uses clang directly, which the runner has.
      #
      # Fetched straight from ziglang.org rather than through setup-zig, whose
      # version index did not know about 0.16 and looked for it among the dev
      # builds, where it is not. And it has to be 0.16: scriptc's runtime calls
      # clock_gettime and nanosleep, which zig 0.13's mingw headers do not
      # declare - four undeclared-function errors before it links.
      # In PowerShell, because the `tar` on the runner's bash is GNU tar and
      # cannot read a zip.
      - name: Install zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "0.16.0"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$v/zig-x86_64-windows-$v.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath . -Force
          "$PWD\zig-x86_64-windows-$v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check zig
        if: runner.os == 'Windows'
        shell: bash
        run: zig version

      - run: npm ci

      - run: npm run build

      - name: Check the binary reports its version
        shell: bash
        run: |
          test -f "${{ matrix.built }}"
          "./${{ matrix.built }}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.built }}
          if-no-files-found: error

  publish:
    # Only a tag publishes. A manual run stops after building, which is the
    # point of being able to trigger it by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the binaries
        run: |
          mkdir -p release
          cp artifacts/gitc.exe/gitc.exe release/gitc.exe
          cp artifacts/gitc/gitc release/gitc
          chmod +x release/gitc
          (cd release && sha256sum gitc gitc.exe > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Download the file for your system and run it. It installs gitc and
            starts it - there is nothing else to do, and nothing to uninstall
            afterwards but `gitc --uninstall`.

            | System | File |
            | ------ | ---- |
            | Windows | `gitc.exe` |
            | Linux | `gitc` (`chmod +x gitc` first) |

            Requires `git` on PATH and a Chromium-based browser for the window.
