# Builds gitc for Windows and Linux and attaches the binaries to a release.
#
# The binaries ARE the installer: running one installs gitc and starts it, so a
# release needs no packaging step and no extra artefacts.
#
# Triggered by pushing a tag, or by hand from the Actions tab (which builds
# without publishing, so the toolchain can be checked without cutting a
# release).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # To find the run that already built this commit and take its binaries.
  actions: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # A tag is pushed only after release.mjs has had this very commit built by a
  # manual run, so the binaries a tag needs usually exist already. Publishing
  # those rather than building again halves the time a release spends on the
  # runners, and on a slow day that is most of a release. A tag with no such
  # run - pushed by hand, or after --skip-verify - builds as it always did.
  verified:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId // ""')
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          echo "built already by run: ${id:-none}"

  build:
    needs: verified
    # Runs on a manual trigger (verified is skipped there) and on a tag that
    # found nothing to reuse.
    if: ${{ !cancelled() && needs.verified.outputs.run-id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gitc.exe
            built: dist/gitc.exe
          - os: ubuntu-latest
            artifact: gitc
            built: dist/gitc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # scriptc needs Node 24 or newer; it is the interpreter the build runs
      # under, so this is the whole Node requirement.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Both platforms build through zig, for different reasons.
      #
      # Windows: scriptc's runtime assumes mingw's CRT and a stock clang targets
      # MSVC's. Linux: targeting musl produces a STATIC binary. Built natively
      # against the runner's glibc, the 0.1.0 release refused to start on any
      # older system - "libm.so.6: version GLIBC_2.38 not found" - because glibc
      # symbols are versioned and only work forwards. A static musl binary asks
      # the system for nothing.
      #
      # Fetched straight from ziglang.org rather than through setup-zig, whose
      # version index did not know about 0.16 and looked for it among the dev
      # builds, where it is not. And it has to be 0.16: scriptc's runtime calls
      # clock_gettime and nanosleep, which zig 0.13's mingw headers do not
      # declare - four undeclared-function errors before it links.
      #
      # Cached, since the download was a quarter to a third of a Windows job.
      - uses: actions/cache@v6
        with:
          path: zig-x86_64-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}-${{ runner.os }}

      - name: Install zig
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dir="zig-x86_64-linux-$ZIG_VERSION"
          if [ ! -d "$dir" ]; then
            curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$dir.tar.xz" | tar -xJ
          fi
          echo "$PWD/$dir" >> "$GITHUB_PATH"

      # In PowerShell, because the `tar` on the runner's bash is GNU tar and
      # cannot read a zip.
      - name: Install zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "zig-x86_64-windows-$env:ZIG_VERSION"
          if (-not (Test-Path $dir)) {
            Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/$dir.zip" -OutFile zig.zip
            Expand-Archive -Path zig.zip -DestinationPath . -Force
          }
          "$PWD\$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check zig
        shell: bash
        run: zig version

      - run: npm ci

      - run: npm run build
        env:
          # Windows picks zigcc for itself; Linux has to be told, because its
          # default is a native clang build against the runner's glibc.
          SCRIPTC_CC: ${{ runner.os == 'Linux' && 'zigcc' || '' }}
          SCRIPTC_TARGET: ${{ runner.os == 'Linux' && 'x86_64-linux-musl' || '' }}

      - name: Check it is tied to no system libc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file ${{ matrix.built }}
          file ${{ matrix.built }} | grep -q "statically linked"
          # A GLIBC_ reference here means the static target did not take, which
          # is the whole failure this arrangement exists to prevent.
          ! readelf -V ${{ matrix.built }} | grep -q GLIBC_

      - name: Check the binary reports its version
        shell: bash
        run: |
          test -f "${{ matrix.built }}"
          "./${{ matrix.built }}" --version

      # These only carry the binary from the build job to the publish job -
      # the release assets are the lasting copy. A day is plenty, and it stops
      # every release leaving a duplicate behind in the artifact store.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.built }}
          if-no-files-found: error
          retention-days: 1

  publish:
    # Only a tag publishes. A manual run stops after building, which is the
    # point of being able to trigger it by hand.
    needs: [verified, build]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && needs.verified.outputs.run-id != '')) }}
    runs-on: ubuntu-latest

    steps:
      # From this run when it built them, from the verification run when not.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          run-id: ${{ needs.verified.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Collect the binaries
        run: |
          mkdir -p release
          cp artifacts/gitc.exe/gitc.exe release/gitc.exe
          cp artifacts/gitc/gitc release/gitc
          chmod +x release/gitc
          (cd release && sha256sum gitc gitc.exe > SHA256SUMS)
          cat release/SHA256SUMS

      # Binaries taken from another run have to be the version being tagged.
      # The Windows one cannot run here; both come from the same commit, and
      # the build job already checked each reports its own version.
      - name: Check the version matches the tag
        run: |
          got=$(./release/gitc --version)
          want="gitc ${GITHUB_REF_NAME#v}"
          echo "$got"
          test "$got" = "$want"

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          # Any tag carrying a prerelease part is a test build. GitHub's
          # /releases/latest - which every released gitc asks for - is defined
          # as the newest release that is neither draft nor prerelease, so
          # this one line is what keeps a test build out of the update stream
          # everybody else is on. No client-side filtering, no second channel.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download the file for your system and run it. It installs gitc and
            starts it - there is nothing else to do, and nothing to uninstall
            afterwards but `gitc --uninstall`.

            | System | File |
            | ------ | ---- |
            | Windows | `gitc.exe` |
            | Linux | `gitc` (`chmod +x gitc` first) |

            Requires `git` on PATH and a Chromium-based browser for the window.
