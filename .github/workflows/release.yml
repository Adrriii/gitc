# Builds gitc for Windows and Linux and attaches the binaries to a release.
#
# The binaries ARE the installer: running one installs gitc and starts it, so a
# release needs no packaging step and no extra artefacts.
#
# Triggered by pushing a tag, or by hand from the Actions tab (which builds
# without publishing, so the toolchain can be checked without cutting a
# release).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gitc.exe
            built: dist/gitc.exe
          - os: ubuntu-latest
            artifact: gitc
            built: dist/gitc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      # scriptc needs Node 24 or newer; it is the interpreter the build runs
      # under, so this is the whole Node requirement.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Both platforms build through zig, for different reasons.
      #
      # Windows: scriptc's runtime assumes mingw's CRT and a stock clang targets
      # MSVC's. Linux: targeting musl produces a STATIC binary. Built natively
      # against the runner's glibc, the 0.1.0 release refused to start on any
      # older system - "libm.so.6: version GLIBC_2.38 not found" - because glibc
      # symbols are versioned and only work forwards. A static musl binary asks
      # the system for nothing.
      #
      # Fetched straight from ziglang.org rather than through setup-zig, whose
      # version index did not know about 0.16 and looked for it among the dev
      # builds, where it is not. And it has to be 0.16: scriptc's runtime calls
      # clock_gettime and nanosleep, which zig 0.13's mingw headers do not
      # declare - four undeclared-function errors before it links.
      - name: Install zig
        if: runner.os == 'Linux'
        shell: bash
        run: |
          v=0.16.0
          curl -fsSL "https://ziglang.org/download/$v/zig-x86_64-linux-$v.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-$v" >> "$GITHUB_PATH"

      # In PowerShell, because the `tar` on the runner's bash is GNU tar and
      # cannot read a zip.
      - name: Install zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "0.16.0"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$v/zig-x86_64-windows-$v.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath . -Force
          "$PWD\zig-x86_64-windows-$v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check zig
        shell: bash
        run: zig version

      - run: npm ci

      - run: npm run build
        env:
          # Windows picks zigcc for itself; Linux has to be told, because its
          # default is a native clang build against the runner's glibc.
          SCRIPTC_CC: ${{ runner.os == 'Linux' && 'zigcc' || '' }}
          SCRIPTC_TARGET: ${{ runner.os == 'Linux' && 'x86_64-linux-musl' || '' }}

      # Debug info is over half the file and nothing reads it from a release:
      # 6.0 MB down to 2.4 MB, which is what the dynamic build used to cost.
      - name: Strip the binary
        if: runner.os == 'Linux'
        run: strip ${{ matrix.built }}

      - name: Check it is tied to no system libc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file ${{ matrix.built }}
          file ${{ matrix.built }} | grep -q "statically linked"
          # A GLIBC_ reference here means the static target did not take, which
          # is the whole failure this arrangement exists to prevent.
          ! readelf -V ${{ matrix.built }} | grep -q GLIBC_

      - name: Check the binary reports its version
        shell: bash
        run: |
          test -f "${{ matrix.built }}"
          "./${{ matrix.built }}" --version

      # These only carry the binary from the build job to the publish job -
      # the release assets are the lasting copy. A day is plenty, and it stops
      # every release leaving a duplicate behind in the artifact store.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.built }}
          if-no-files-found: error
          retention-days: 1

  publish:
    # Only a tag publishes. A manual run stops after building, which is the
    # point of being able to trigger it by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the binaries
        run: |
          mkdir -p release
          cp artifacts/gitc.exe/gitc.exe release/gitc.exe
          cp artifacts/gitc/gitc release/gitc
          chmod +x release/gitc
          (cd release && sha256sum gitc gitc.exe > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Download the file for your system and run it. It installs gitc and
            starts it - there is nothing else to do, and nothing to uninstall
            afterwards but `gitc --uninstall`.

            | System | File |
            | ------ | ---- |
            | Windows | `gitc.exe` |
            | Linux | `gitc` (`chmod +x gitc` first) |

            Requires `git` on PATH and a Chromium-based browser for the window.
